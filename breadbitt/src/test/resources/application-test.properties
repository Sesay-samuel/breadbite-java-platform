# ==========================================================
# Breadbite - Test Configuration
# ==========================================================

spring.application.name=breadbitt-test

# ==========================================================
# H2 In-Memory Test Database
# ==========================================================

# Use an isolated in-memory database during automated tests.
# MODE=MySQL improves compatibility with the application's MySQL schema.
# NON_KEYWORDS=USER allows the existing "user" table name to work with H2.
spring.datasource.url=jdbc:h2:mem:breadbite_test;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================================
# JPA / Hibernate
# ==========================================================


# Create the schema when tests start and remove it when tests finish.
spring.jpa.hibernate.ddl-auto=create-drop

# Keep test output cleaner.
spring.jpa.show-sql=false

# Prevent database sessions from remaining open during web view rendering.
spring.jpa.open-in-view=false

# ==========================================================
# Mail Configuration - Test Only
# ==========================================================

# These are fake values used only while running automated tests.
# No real email credentials should be stored here.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
support.email=test@breadbite.local

# ==========================================================
# Logging
# ==========================================================

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN