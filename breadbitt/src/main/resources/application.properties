
# ==========================================================
# Breadbite Customer Application
# ==========================================================

spring.application.name=breadbitt
server.port=8098


# ==========================================================
# Thymeleaf Configuration
# ==========================================================

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8


# ==========================================================
# File Upload Configuration
# ==========================================================

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# ==========================================================
# PostgreSQL Data Source
# ==========================================================

# Database credentials are supplied through environment variables.
# Never commit database passwords to GitHub.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/breadbite}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ==========================================================
# JPA / Hibernate Configuration
# ==========================================================

spring.jpa.show-sql=false

# Temporary setting for local database schema updates.
# Replace with Flyway or Liquibase migrations later.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Disable Open Session in View.
spring.jpa.open-in-view=false


# ==========================================================
# Email / SMTP Configuration
# ==========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

support.email=${SUPPORT_EMAIL}

app.base-url=http://localhost:8098


# ==========================================================
# Apache Kafka - Connection
# ==========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Topic for OrderPlaced events.
breadbite.kafka.order-topic=breadbite.orders.placed


# ==========================================================
# Apache Kafka - Producer
# ==========================================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# ==========================================================
# Apache Kafka - Consumer
# ==========================================================

spring.kafka.consumer.group-id=breadbite-order-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false


# ==========================================================
# Apache Kafka - Safe Deserialization
# ==========================================================

# Wrap the actual deserializers so malformed Kafka records
# can be handled by Spring Kafka's error handler.

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Delegate key deserialization to StringDeserializer.
spring.kafka.consumer.properties[spring.deserializer.key.delegate.class]=org.apache.kafka.common.serialization.StringDeserializer

# Delegate value deserialization to JsonDeserializer.
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JsonDeserializer


# ==========================================================
# Apache Kafka - JSON Event Configuration
# ==========================================================

# Restrict trusted JSON types to Breadbite event classes.
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.breadbitt.events

# Default Java class for incoming OrderPlaced events.
spring.kafka.consumer.properties[spring.json.value.default.type]=com.breadbitt.events.OrderPlacedEvent

# Allow JSON messages without Spring Kafka type headers,
# including messages from kafka-console-producer.
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
