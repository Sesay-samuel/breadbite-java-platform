# ==========================================================
# Breadbite Customer Application
# ==========================================================

spring.application.name=breadbitt
server.port=8098


# ==========================================================
# Thymeleaf
# ==========================================================

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8


# ==========================================================
# File Upload
# ==========================================================

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# ==========================================================
# PostgreSQL Data Source
# ==========================================================

# Database credentials are supplied through environment variables.
# No database passwords should be committed to source control.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ==========================================================
# JPA / Hibernate
# ==========================================================

spring.jpa.show-sql=false

# During the migration phase Hibernate may update the local schema.
# This will later be replaced by controlled database migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Prevent persistence sessions from remaining open while views render.
spring.jpa.open-in-view=false


# ==========================================================
# Email
# ==========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

support.email=${SUPPORT_EMAIL}