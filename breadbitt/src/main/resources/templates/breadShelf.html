
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/header :: common-header}">
    <title>Breadbite - All Breads</title>
</head>

<body>

<div th:replace="~{common/header :: navbar}"></div>

<div class="container">

    <!-- Page heading -->
    <div class="row mb-3">

        <div class="col">
            <h2 class="section-headline">
                <span th:text="${user != null}
                    ? ${#strings.toUpperCase(user.username)}
                    : 'All Breads'">
                    All Breads
                </span>
            </h2>
        </div>

        <div class="col-md-4">
            <img th:src="@{/image/logo.png}"
                 class="img-fluid"
                 alt="Breadbite Bakery Logo" />
        </div>

    </div>

    <!-- Bakery background -->
    <hr class="position-absolute w-100"
        style="height: 6px;
               background-color: #333;
               z-index: -1;
               margin-top: -80px;" />

    <img class="img-fluid"
         th:src="@{/image/wood.png}"
         alt="Wood Background"
         style="margin-top: -75px;" />

    <!-- Bread products -->
    <div class="row mt-3">
        <div class="col">

            <!-- Empty product list -->
            <div th:if="${emptyList}">
                <h5 class="font-italic">
                    Oops, no result is found.
                    Try something else or try again later.
                </h5>
            </div>

            <!-- Each bread product -->
            <div th:each="bread : ${breadList}">

                <div class="row mb-4">

                    <!-- Bread image -->
                    <div class="col-md-3">

                        <a th:href="@{/breadDetail(id=${bread.id})}">

                            <img
                                class="img-fluid shelf-bread"
                                th:src="@{'/image/bread/' + ${bread.id} + '.png'}"
                                th:alt="${bread.title}"
                                style="width: 220px;
                                       height: 220px;
                                       object-fit: cover;
                                       border-radius: 8px;" />

                        </a>

                    </div>

                    <!-- Bread details -->
                    <div class="col-md-9">

                        <a th:href="@{/breadDetail(id=${bread.id})}">
                            <h4 th:text="${bread.title}">
                                Bread Name
                            </h4>
                        </a>

                        <span th:text="${bread.bakeDate}"></span>
                        <br />

                        <p th:text="${bread.baker}"></p>

                        <p th:text="${bread.type}"></p>

                        <p th:text="${bread.category}"></p>

                        <p th:text="${bread.format}"></p>

                        <span th:text="${bread.weight}"></span>
                        ounces
                        <br />

                        <a th:href="@{/breadDetail(id=${bread.id})}">
                            <span th:text="${#strings.capitalize(bread.format)}">
                            </span>
                        </a>

                        <br />

                        <!-- Bread price -->
                        <div class="mt-2">

                            <a th:href="@{/breadDetail(id=${bread.id})}">

                                <span class="text-danger"
                                      style="font-size: x-large;">

                                    $<span
                                        th:text="${#numbers.formatDecimal(
                                            bread.ourPrice,
                                            1,
                                            'COMMA',
                                            2,
                                            'POINT')}">
                                        0.00
                                    </span>

                                </span>

                            </a>

                            <span class="text-muted"
                                  style="text-decoration: line-through;">

                                $<span
                                    th:text="${#numbers.formatDecimal(
                                        bread.listPrice,
                                        1,
                                        'COMMA',
                                        2,
                                        'POINT')}">
                                    0.00
                                </span>

                            </span>

                        </div>

                        <!-- Bread ingredients -->
                        <p class="mt-2"
                           th:text="${#strings.abbreviate(bread.ingredients, 1000)}">
                        </p>

                    </div>

                </div>

                <hr />

            </div>

        </div>
    </div>

</div>

<!-- Footer scripts -->
<div th:replace="~{common/header :: body-bottom-scripts}"></div>

</body>
</html>
