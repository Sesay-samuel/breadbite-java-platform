<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/header :: common-header" />

<body>
    <div th:replace="common/header :: navbar" />
    <div class="container">
        <div class="row mb-3">
            <div class="col">
                <h2 class="section-headline">
                    <span th:text="${user} ? ${#strings.toUpperCase(user.username)} : 'All Breads'"></span>
                </h2>
            </div>
              <div class="col-md-4">
                <img src="/image/logo.png" class="img-fluid" alt="Logo" />
              </div>
            </div>
              <hr class="position-absolute w-100" style="height: 6px; background-color: #333; z-index: -1; margin-top: -80px;">
              <img class="img-fluid" src="/image/wood.png" alt="Wood Image" style="margin-top: -75px;" />
            
        <div class="row mt-3">
            <div class="col">
                <div th:if="${emptyList}">
                    <h5 class="font-italic">Oops, no result is found. Try something else or try again later.</h5>
                </div>

                <div th:each="bread : ${breadList}">
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <a th:href="@{/breadDetail?id=}+${bread.id}">
                                <!-- Ensure correct path to the bread image -->
                                <img class="img-fluid shelf-bread" th:src="${adminPath + '/image/bread/' + bread.id + '.png'}" />
                            </a>
                        </div>
                        <div class="col-md-9">
                            <a th:href="@{/breadDetail?id=}+${bread.id}"><h4 th:text="${bread.title}"></h4></a>
                            <span th:text="${bread.bakeDate}"></span><br />
                            <p th:text="${bread.baker}"></p>
                            <p th:text="${bread.type}"></p>
                            <p th:text="${bread.category}"></p>
                            <p th:text="${bread.format}"></p>
                            <span th:text="${bread.weight}"></span> ounces<br />
                            <a th:href="@{/breadDetail?id=}+${bread.id}">
                                <span th:text="${#strings.capitalize(bread.format)}"></span>
                            </a>
                            <span th:text="${bread.ingredients}"><span> size</span></span><br />
                            <a th:href="@{/breadDetail?id=}+${bread.id}">
                                <span class="text-danger" style="font-size: x-large;">
                                    $<span th:text="${#numbers.formatDecimal(bread.ourPrice, 0 , 'COMMA', 2, 'POINT')}"></span>
                                </span>
                            </a>
                            <span class="text-muted" style="text-decoration: line-through;">
                                $<span th:text="${#numbers.formatDecimal(bread.listPrice, 0 , 'COMMA', 2, 'POINT')}"></span>
                            </span>
                            <p th:utext="${#strings.abbreviate(bread.ingredients, 1000)}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- end of container -->
    <div th:replace="common/header :: body-bottom-scripts" />
</body>
</html>
