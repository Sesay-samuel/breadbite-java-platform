<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="common/header :: common-header">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="common/header :: navbar"></div>

<div class="container">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2 class="section-headline">
                <span th:text="${user != null} ? ${#strings.toUpperCase(user.username)} : 'All Breads'"></span>
            </h2>
        </div>
         <div class="col-md-4">
                <img src="/image/logo.png" class="img-fluid" alt="Logo" />
            </div>
        </div>
        <hr class="position-absolute w-100" style="height: 6px; background-color: #333; z-index: -1; margin-top: -80px;">
        <img class="img-fluid" src="/image/wood.png" alt="Wood Image" style="margin-top: -75px;" />
       

    <form th:action="@{/shoppingCart/addItem}" method="post">
        <input type="hidden" name="breadId" th:value="${bread.id}" />
        <div class="row mt-5">
            <div class="col-md-3">
                <a th:href="@{/breadshelf}" class="btn btn-link">Back to bread list</a><br/>
                <img class="img-fluid shelf-bread" th:src="@{'/image/bread/' + ${bread.id} + '.png'}" alt="Bread Image"/>
            </div>

            <div class="col-md-9">
                <h3>
                    <span th:if="${addBreadSuccess}" class="text-success">
                        <i class="fa fa-check" aria-hidden="true"></i> Added to cart.
                    </span>
                </h3>
                <h3>
                    <span th:if="${notEnoughStock}" class="text-danger">
                        Oops, only <span th:text="${bread.inStockNumber}"></span> In Stock.
                    </span>
                </h3>
                <h3 th:text="${bread.title}">Bread Title</h3>
                <div class="row">
                    <div class="col-md-5">
                        <h5><strong>Type: </strong><span th:text="${bread.type}"></span></h5>
                        <p><strong>Baker: </strong><span th:text="${bread.baker}"></span></p>
                        <p><strong>bakeDate: </strong><span th:text="${bread.bakeDate}"></span></p>
                        <p><strong>Category: </strong><span th:text="${bread.category}"></span></p>
                        <p><strong>Weight: </strong><span th:text="${bread.weight}"></span> grams</p>
                        <p><strong>Ingredients: </strong><span th:text="${bread.ingredients}"></span></p>
                    </div>

                    <div class="col-md-7">
                        <div class="card mt-3">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <h4>Our Price: 
                                            <span class="text-danger">
                                                $<span th:text="${bread.ourPrice}"></span>
                                            </span>
                                        </h4>
                                        <p>List Price: 
                                            <span class="text-decoration-line-through">
                                                $<span th:text="${bread.listPrice}"></span>
                                            </span>
                                        </p>
                                        <p>You save: $
                                            <span th:text="${#numbers.formatDecimal((bread.listPrice - bread.ourPrice), 0, 'COMMA', 2, 'POINT')}"></span>
                                        </p>
                                        <span>Qty: </span>
                                        <select name="qty" class="form-select">
                                            <option th:each="qty : ${qtyList}" th:value="${qty}" th:text="${qty}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <h4 th:if="${bread.inStockNumber > 10}" class="text-success">In Stock</h4>
                                        <h4 th:if="${bread.inStockNumber < 10 and bread.inStockNumber > 0}" class="text-success">
                                            Only <span th:text="${bread.inStockNumber}"></span> In Stock
                                        </h4>
                                        <h4 th:if="${bread.inStockNumber == 0}" class="text-danger">Unavailable</h4>
                                        <button type="submit" class="btn btn-warning mt-3">
                                            Add to Cart
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <hr/>
                <p th:utext="${bread.description}"></p>
            </div>
        </div>
    </form>
</div>
<!-- end of container -->

<div th:replace="common/header :: body-bottom-scripts"></div>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
