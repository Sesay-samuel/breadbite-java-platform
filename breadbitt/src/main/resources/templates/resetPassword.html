
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Reset Password - Salone Breadbitt</title>
</head>
<body>

<main>
    <h1>Set a New Password</h1>

    <div th:if="${invalidToken}">
        <p>
            This password-reset link is invalid or expired.
            Please request a new link.
        </p>
        <a th:href="@{/login}">Return to login</a>
    </div>

    <div th:unless="${invalidToken}">

        <p th:if="${passwordMismatch}">
            The passwords do not match.
        </p>

        <form th:action="@{/resetPassword}"
              method="post">

            <input type="hidden"
                   name="token"
                   th:value="${token}">

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <label for="newPassword">
                New password
            </label>

            <input type="password"
                   id="newPassword"
                   name="newPassword"
                   minlength="12"
                   maxlength="128"
                   autocomplete="new-password"
                   required>

            <label for="confirmPassword">
                Confirm new password
            </label>

            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword"
                   minlength="12"
                   maxlength="128"
                   autocomplete="new-password"
                   required>

            <button type="submit">
                Set Password
            </button>

        </form>
    </div>
</main>

</body>
</html>
