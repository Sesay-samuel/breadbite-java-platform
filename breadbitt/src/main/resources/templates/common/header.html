
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="common-header">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Sierra Leone BreadBite</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link th:href="@{/css/font-awesome.min.css}"
          rel="stylesheet">

    <!-- Application CSS -->
    <link th:href="@{/css/style.css}"
          rel="stylesheet">

    <link th:href="@{/image/applie-touch-icon.png}"
          rel="icon">

</head>

<body>

<!-- ====================================== -->
<!-- NAVIGATION BAR -->
<!-- ====================================== -->

<div th:fragment="navbar">

    <div style="width:100%;
                height:20px;
                background-color:forestgreen;">
    </div>

    <nav class="navbar navbar-expand-lg navbar-light"
         style="background-color:#e3f2fd;">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold"
               th:href="@{/}">
                BreadBite
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#breadbiteNavbar"
                    aria-controls="breadbiteNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="breadbiteNavbar">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle"
                           href="#"
                           id="breadDropdown"
                           role="button"
                           data-bs-toggle="dropdown"
                           aria-expanded="false">

                            Salone Bread

                        </a>

                        <ul class="dropdown-menu"
                            aria-labelledby="breadDropdown">

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/breadShelf}">

                                    Browse the Breadshelf

                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   href="#">

                                    Store Hours &amp; Directions

                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   href="#">

                                    FAQ

                                </a>
                            </li>

                        </ul>

                    </li>

                </ul>

                <!-- Search -->
                <form class="d-flex me-3"
                      th:action="@{/breadShelf}"
                      method="get"
                      role="search">

                    <input class="form-control me-2"
                           type="search"
                           name="keyword"
                           placeholder="Bread name"
                           aria-label="Search">

                    <button class="btn btn-outline-success"
                            type="submit">

                        Search

                    </button>

                </form>

                <!-- Shopping Cart -->
                <a class="btn btn-success me-2"
                   th:href="@{/shoppingCart/cart}">

                    <i class="bi bi-cart3"></i>
                    Shopping Cart

                </a>

                <!-- Anonymous Users -->
                <a class="btn btn-outline-primary me-2"
                   sec:authorize="isAnonymous()"
                   th:href="@{/login}">

                    <i class="bi bi-person"></i>
                    My Account

                </a>

                <!-- Authenticated Users -->
                <a class="btn btn-primary me-2"
                   sec:authorize="isAuthenticated()"
                   th:href="@{/myProfile}">

                    <i class="bi bi-person-circle"></i>
                    My Account

                </a>

                <!-- Secure POST Logout -->
                <form sec:authorize="isAuthenticated()"
                      th:action="@{/logout}"
                      method="post"
                      class="d-inline">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button class="btn btn-outline-danger"
                            type="submit">

                        <i class="bi bi-box-arrow-right"></i>
                        Logout

                    </button>

                </form>

            </div>

        </div>

    </nav>

</div>

<!-- ====================================== -->
<!-- JAVASCRIPT -->
<!-- ====================================== -->

<div th:fragment="body-bottom-scripts">

    <!-- Bootstrap Bundle -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Existing DataTables scripts -->
    <script th:src="@{/js/jquery.dataTables.min.js}"></script>

    <script th:src="@{/js/dataTables.bootstrap.min.js}"></script>

</div>

</body>
</html>
