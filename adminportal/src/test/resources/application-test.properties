# ==========================================================
# Breadbite Admin Portal - Test Configuration
# ==========================================================

spring.application.name=adminportal-test

# ==========================================================
# H2 In-Memory Test Database
# ==========================================================

# Use an isolated in-memory database during automated tests.
# PostgreSQL compatibility mode provides closer behaviour to the
# PostgreSQL database used by the application.
# NON_KEYWORDS=USER allows the existing "user" table name to work with H2.
spring.datasource.url=jdbc:h2:mem:adminportal_test;MODE=PostgreSQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================================
# JPA / Hibernate
# ==========================================================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================================
# Logging
# ==========================================================

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN
