
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="common-header">

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>Salone Breadbitt | Admin Portal</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Application CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet" />

    <!-- DataTables CSS -->
    <link
        th:href="@{/css/jquery.dataTables.min.css}"
        rel="stylesheet"
    />

    <link
        th:href="@{/css/dataTables.bootstrap.min.css}"
        rel="stylesheet"
    />

    <!-- Favicon -->
    <link
        rel="icon"
        th:href="@{/image/apple-touch-icon.png}"
    />

    <!-- TinyMCE editor -->
    <script
        src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js"
        referrerpolicy="origin">
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof tinymce !== "undefined") {
                tinymce.init({
                    selector: "textarea"
                });
            }
        });
    </script>

</head>

<body>

    <!-- ================================= -->
    <!-- ADMIN NAVIGATION BAR              -->
    <!-- ================================= -->

    <div th:fragment="navbar">

        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

            <div class="container-fluid">

                <!-- Brand -->
                <a class="navbar-brand" th:href="@{/}">
                    Admin Portal
                </a>

                <!-- Mobile navigation toggle -->
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#adminNavbar"
                    aria-controls="adminNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- Navigation content -->
                <div
                    class="collapse navbar-collapse"
                    id="adminNavbar">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <!-- Bread management dropdown -->
                        <li class="nav-item dropdown">

                            <button
                                class="btn btn-success dropdown-toggle"
                                type="button"
                                id="breadDropdown"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">

                                Salone Bread

                            </button>

                            <ul
                                class="dropdown-menu"
                                aria-labelledby="breadDropdown">

                                <li>
                                    <a
                                        class="dropdown-item"
                                        th:href="@{/home/bread/add}">

                                        Add a New Bread

                                    </a>
                                </li>

                                <li>
                                    <a
                                        class="dropdown-item"
                                        th:href="@{/home/bread/breadList}">

                                        View Bread List

                                    </a>
                                </li>

                            </ul>

                        </li>

                    </ul>

                    <!-- ================================= -->
                    <!-- CSRF-PROTECTED LOGOUT FORM         -->
                    <!-- ================================= -->

                    <form
                        th:action="@{/logout}"
                        method="post"
                        class="d-flex m-0">

                        <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}"
                        />

                        <button
                            type="submit"
                            class="btn btn-success">

                            Sign Out

                        </button>

                    </form>

                </div>

            </div>

        </nav>

    </div>

    <!-- ================================= -->
    <!-- COMMON JAVASCRIPT                  -->
    <!-- ================================= -->

    <div th:fragment="body-bottom-scripts">

        <!-- Bootstrap JavaScript bundle -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        </script>

    </div>

</body>
</html>
