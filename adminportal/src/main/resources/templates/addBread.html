
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/header :: common-header}"></head>

<body>

    <div th:replace="~{common/header :: navbar}"></div>

    <div class="container py-4">

        <h3 class="mb-4">Add New Bread</h3>

        <form
            th:action="@{/home/bread/add}"
            method="post"
            enctype="multipart/form-data">

            <!-- CSRF Protection -->
            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}"
            />

            <fieldset>

                <legend>
                    New Bread Information
                    <small class="text-muted">
                        (* Required field)
                    </small>
                </legend>

                <!-- Title -->
                <div class="mb-3">
                    <label for="title" class="form-label">
                        * Bread Title
                    </label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-control"
                        th:value="${bread.title}"
                        required
                    />
                </div>

                <!-- Baker -->
                <div class="mb-3">
                    <label for="baker" class="form-label">Baker</label>
                    <input
                        type="text"
                        id="baker"
                        name="baker"
                        class="form-control"
                        th:value="${bread.baker}"
                    />
                </div>

                <!-- Type -->
                <div class="mb-3">
                    <label for="type" class="form-label">Type</label>
                    <input
                        type="text"
                        id="type"
                        name="type"
                        class="form-control"
                        th:value="${bread.type}"
                    />
                </div>

                <!-- Bake Date -->
                <div class="mb-3">
                    <label for="bakeDate" class="form-label">
                        Bake Date
                    </label>
                    <input
                        type="date"
                        id="bakeDate"
                        name="bakeDate"
                        class="form-control"
                        th:value="${bread.bakeDate}"
                    />
                </div>

                <!-- Ingredients -->
                <div class="mb-3">
                    <label for="ingredients" class="form-label">
                        Ingredients
                    </label>
                    <input
                        type="text"
                        id="ingredients"
                        name="ingredients"
                        class="form-control"
                        th:value="${bread.ingredients}"
                    />
                </div>

                <!-- Category -->
                <div class="mb-3">
                    <label for="category" class="form-label">
                        Category
                    </label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        class="form-control"
                        th:value="${bread.category}"
                    />
                </div>

                <!-- Weight -->
                <div class="mb-3">
                    <label for="weight" class="form-label">
                        Weight
                    </label>
                    <input
                        type="number"
                        id="weight"
                        name="weight"
                        class="form-control"
                        th:value="${bread.weight}"
                    />
                </div>

                <!-- Stock -->
                <div class="mb-3">
                    <label for="inStockNumber" class="form-label">
                        Number in Stock
                    </label>
                    <input
                        type="number"
                        id="inStockNumber"
                        name="inStockNumber"
                        class="form-control"
                        th:value="${bread.inStockNumber}"
                        min="0"
                    />
                </div>

                <!-- Size -->
                <div class="mb-3">
                    <label for="size" class="form-label">Size</label>
                    <input
                        type="text"
                        id="size"
                        name="size"
                        class="form-control"
                        th:value="${bread.size}"
                    />
                </div>

                <!-- SKU -->
                <div class="mb-3">
                    <label for="sku" class="form-label">SKU</label>
                    <input
                        type="text"
                        id="sku"
                        name="sku"
                        class="form-control"
                        th:value="${bread.sku}"
                    />
                </div>

                <!-- Format -->
                <div class="mb-3">
                    <label for="format" class="form-label">Format</label>
                    <select
                        id="format"
                        name="format"
                        class="form-select">

                        <option value="paperback">Paperback</option>
                        <option value="hardcover">Hardcover</option>

                    </select>
                </div>

                <!-- Shipping Weight -->
                <div class="mb-3">
                    <label for="shippingWeight" class="form-label">
                        Shipping Weight
                    </label>
                    <input
                        type="number"
                        id="shippingWeight"
                        name="shippingWeight"
                        class="form-control"
                        th:value="${bread.shippingWeight}"
                    />
                </div>

                <!-- List Price -->
                <div class="mb-3">
                    <label for="listPrice" class="form-label">
                        List Price
                    </label>
                    <input
                        type="number"
                        step="0.01"
                        id="listPrice"
                        name="listPrice"
                        class="form-control"
                        th:value="${bread.listPrice}"
                    />
                </div>

                <!-- Our Price -->
                <div class="mb-3">
                    <label for="ourPrice" class="form-label">
                        Our Price
                    </label>
                    <input
                        type="number"
                        step="0.01"
                        id="ourPrice"
                        name="ourPrice"
                        class="form-control"
                        th:value="${bread.ourPrice}"
                    />
                </div>

                <!-- Active -->
                <div class="form-check mb-3">
                    <input
                        type="checkbox"
                        id="active"
                        name="active"
                        class="form-check-input"
                        th:checked="${bread.active}"
                    />
                    <label for="active" class="form-check-label">
                        Active
                    </label>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description
                    </label>
                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        class="form-control"
                        th:text="${bread.description}">
                    </textarea>
                </div>

                <!-- Bread Image -->
                <div class="mb-4">
                    <label for="breadImage" class="form-label">
                        Upload Bread Image
                    </label>
                    <input
                        type="file"
                        id="breadImage"
                        name="breadImage"
                        class="form-control"
                        accept="image/*"
                    />
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-success">
                        Add Bread
                    </button>

                    <a
                        th:href="@{/home}"
                        class="btn btn-danger">
                        Cancel
                    </a>

                </div>

            </fieldset>

        </form>

    </div>

    <div th:replace="~{common/header :: body-bottom-scripts}"></div>

</body>
</html>
