<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/header :: common-header" />

<body>
    <div th:replace="common/header :: navbar" />
    
    <div class="container">
        <div>
            <ol class="breadcrumb">
                <li><a th:href="@{/home/bread/breadList}"><i class="fa fa-long-arrow-left" aria-hidden="true"></i>Go back</a></li>
                <li><a th:href="@{/home/bread/updateBread(id=${bread.id})}">Edit</a></li>
            </ol>
        </div>
        
        <!-- Include code for displaying bread's ID -->
        <div class="form-group" th:if="${bread != null}">
            <label class="col-md-2 control-label" for="id">ID</label>
            <div class="col-md-8">
                <span th:text="${bread.id}"></span>
            </div>
        </div>
        <div class="form-group" th:if="${bread == null}">
            <!-- Handle the case when bread is not found -->
            <span>No bread found</span>
        </div>
        
        <div class="row">
            <div class="col-md-3">
                <div class="panel panel-default">
                    <div class="panel-body">
                        <img th:src="@{/image/bread/}+${bread.id}+'.png'" class="img-fluid mx-auto d-block" th:if="${bread != null}" />
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <h3 th:text="${bread.title}"></h3>
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Baker: </strong><span th:text="${bread.baker}"></span></p>
                        <p><strong>Bake Date: </strong><span th:text="${bread.bakeDate}"></span></p>
                        <p><strong>Category: </strong><span th:text="${bread.category}"></span></p>
                        <p><strong>Ingredients: </strong><span th:text="${bread.ingredients}"></span></p>
                        <p><strong>List Price: </strong><span th:text="${bread.listPrice}"></span></p>
                        <p><strong>Number in Stock: </strong><span th:text="${bread.inStockNumber}"></span></p>
                        <p><strong>Shipping Weight: </strong><span th:text="${bread.shippingWeight}"></span></p>
                        <p><strong>SKU: </strong><span th:text="${bread.sku}"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Our Price: </strong><span th:text="${bread.ourPrice}"></span></p>
                        <p><strong>Active: </strong><span th:text="${bread.active}"></span></p>
                    </div>
                </div>
                
                <p><strong>Description: </strong><span th:utext="${bread.description}"></span></p>
            </div>
        </div>
    </div>

    <div th:replace="common/header :: body-bottom-scripts" />
</body>
</html>
