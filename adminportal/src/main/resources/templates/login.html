<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/header :: common-header"></head>
<body>
    <div class="container">
        <h5 class="text-center mt-3">Welcome to Admin Portal for Bread Salone.</h5>
        <hr />
        <img th:src="@{/image/logo.png}" class="img-responsive mx-auto d-block" style="width: 250px;" />

        <div class="row">
            <div class="col-4 offset-md-4">
                <div class="bg-danger" th:if="${param.error}">Invalid username and password.</div>
                <div class="bg-danger" th:if="${param.logout}">You have been logged out.</div>
                <form class="form-signin" th:action="@{/login}" method="post">
                    <h2 class="form-signin-heading">Please sign in</h2>
                    <div class="form-group">
                        <label for="username" class="sr-only">Username</label>
                        <input type="text" class="form-control" placeholder="Username"
                            name="username" id="username" required autofocus />
                    </div>
                    <div class="form-group">
                        <label for="password" class="sr-only">Password</label>
                        <input type="password" class="form-control" placeholder="Password"
                            name="password" id="password" required />
                    </div>
                    <button class="btn btn-lg btn-primary btn-block" type="submit">Sign In</button>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="common/header :: body-bottom-scripts"></div>
</body>
</html>
