
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/header :: common-header}"></head>

<body>

    <!-- Admin Navigation -->
    <div th:replace="~{common/header :: navbar}"></div>

    <div class="container py-4">

        <h3 class="mb-4">Update Bread Information</h3>

        <form
            class="form-horizontal"
            th:action="@{/home/bread/updateBread}"
            method="post"
            enctype="multipart/form-data">

            <!-- CSRF Protection -->
            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}"
            />

            <!-- Bread ID -->
            <input
                type="hidden"
                name="id"
                th:value="${bread.id}"
            />

            <fieldset>

                <legend>
                    Edit Bread Details
                    <small class="text-muted">
                        (* Required fields)
                    </small>
                </legend>

                <!-- Bread Title -->
                <div class="mb-3">
                    <label for="title" class="form-label">
                        * Bread Title
                    </label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-control"
                        th:value="${bread.title}"
                        required
                    />
                </div>

                <!-- Category -->
                <div class="mb-3">
                    <label for="category" class="form-label">
                        * Category
                    </label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        class="form-control"
                        th:value="${bread.category}"
                        required
                    />
                </div>

                <!-- List Price -->
                <div class="mb-3">
                    <label for="listPrice" class="form-label">
                        * List Price
                    </label>
                    <input
                        type="number"
                        id="listPrice"
                        name="listPrice"
                        class="form-control"
                        th:value="${bread.listPrice}"
                        min="0"
                        step="0.01"
                        required
                    />
                </div>

                <!-- Our Price -->
                <div class="mb-3">
                    <label for="ourPrice" class="form-label">
                        * Our Price
                    </label>
                    <input
                        type="number"
                        id="ourPrice"
                        name="ourPrice"
                        class="form-control"
                        th:value="${bread.ourPrice}"
                        min="0"
                        step="0.01"
                        required
                    />
                </div>

                <!-- Number in Stock -->
                <div class="mb-3">
                    <label for="inStockNumber" class="form-label">
                        Number in Stock
                    </label>
                    <input
                        type="number"
                        id="inStockNumber"
                        name="inStockNumber"
                        class="form-control"
                        th:value="${bread.inStockNumber}"
                        min="0"
                    />
                </div>

                <!-- Active Status -->
                <div class="mb-3">
                    <label for="active" class="form-label">
                        * Active
                    </label>

                    <select
                        id="active"
                        name="active"
                        class="form-select"
                        required>

                        <option
                            value="true"
                            th:selected="${bread.active == true}">
                            Yes
                        </option>

                        <option
                            value="false"
                            th:selected="${bread.active == false}">
                            No
                        </option>

                    </select>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        class="form-control"
                        th:text="${bread.description}">
                    </textarea>
                </div>

                <!-- Bread Image -->
                <div class="mb-4">
                    <label for="breadImage" class="form-label">
                        Upload New Bread Image
                    </label>

                    <input
                        type="file"
                        id="breadImage"
                        name="breadImage"
                        class="form-control"
                        accept="image/*"
                    />

                    <small class="text-muted">
                        Leave this empty to keep the existing image.
                    </small>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">
                        Update Bread
                    </button>

                    <a
                        th:href="@{/home/bread/breadInfo(id=${bread.id})}"
                        class="btn btn-danger">
                        Cancel
                    </a>

                </div>

            </fieldset>

        </form>

    </div>

    <!-- Common JavaScript -->
    <div th:replace="~{common/header :: body-bottom-scripts}"></div>

</body>
</html>
