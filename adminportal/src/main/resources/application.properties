# ==========================================================
# Breadbite Administration Portal
# ==========================================================

spring.application.name=adminportal

server.port=8099
server.servlet.context-path=/adminportal


# ==========================================================
# Thymeleaf
# ==========================================================

spring.thymeleaf.cache=false


# ==========================================================
# File Upload
# ==========================================================

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# ==========================================================
# PostgreSQL Data Source
# ==========================================================

# Database credentials are supplied through environment variables.
# No database passwords should be committed to source control.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ==========================================================
# JPA / Hibernate
# ==========================================================

spring.jpa.show-sql=false

# During the migration phase Hibernate may update the local schema.
# This will later be replaced by controlled database migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Prevent persistence sessions from remaining open while views render.
spring.jpa.open-in-view=false