
services:
  cassandra:
    image: cassandra:5.0
    container_name: breadbite-cassandra
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: BreadbiteCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - breadbite_cassandra_data:/var/lib/cassandra
    restart: unless-stopped

volumes:
  breadbite_cassandra_data:
